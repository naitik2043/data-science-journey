<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinja2</title>
</head>
<body>

    <h2>Hey, I am {{ name }} and I am using Jinja2.</h2>

    <p>My primary language is {{ lang }}</p>

    <h3>Lucky Numbers:</h3>

    {% for item in lucky %}
        <p>{{ item }}</p>
    {% endfor %}

    {{ footer | safe }}

</body>
</html>
